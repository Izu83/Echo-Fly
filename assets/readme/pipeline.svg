<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="250" viewBox="0 0 1164 250" role="img" aria-label="Pipeline: virtual world, sonar ping, sensory neurons, fly connectome, motor neurons, then the fly moves and pings again"><title>Pipeline: virtual world, sonar ping, sensory neurons, fly connectome, motor neurons, then the fly moves and pings again</title><style>@font-face{font-family:'Saira';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Saira';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Saira';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');} text{font-family:'Saira',sans-serif;}</style><rect width="1164" height="250" rx="20" fill="#241D22"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#99E1D9"/></marker></defs><rect x="20" y="30" width="196" height="104" rx="12" fill="#32292F" stroke="#99E1D9" stroke-width="2"/><text x="118.0" y="76" font-size="21" font-weight="700" fill="#99E1D9" text-anchor="middle" >Virtual world</text><text x="118.0" y="106" font-size="16" font-weight="400" fill="#B9AEB5" text-anchor="middle" >walls / a building</text><line x1="220" y1="82.0" x2="248" y2="82.0" stroke="#99E1D9" stroke-width="2.5" marker-end="url(#a)"/><rect x="252" y="30" width="196" height="104" rx="12" fill="#32292F" stroke="#99E1D9" stroke-width="2"/><text x="350.0" y="76" font-size="21" font-weight="700" fill="#99E1D9" text-anchor="middle" >Sonar ping</text><text x="350.0" y="106" font-size="16" font-weight="400" fill="#B9AEB5" text-anchor="middle" >beams bounce back</text><line x1="452" y1="82.0" x2="480" y2="82.0" stroke="#99E1D9" stroke-width="2.5" marker-end="url(#a)"/><rect x="484" y="30" width="196" height="104" rx="12" fill="#32292F" stroke="#99E1D9" stroke-width="2"/><text x="582.0" y="76" font-size="21" font-weight="700" fill="#99E1D9" text-anchor="middle" >Sensory neurons</text><text x="582.0" y="106" font-size="16" font-weight="400" fill="#B9AEB5" text-anchor="middle" >echo → firing rate</text><line x1="684" y1="82.0" x2="712" y2="82.0" stroke="#99E1D9" stroke-width="2.5" marker-end="url(#a)"/><rect x="716" y="30" width="196" height="104" rx="12" fill="#99E1D9" stroke="#99E1D9" stroke-width="2"/><text x="814.0" y="76" font-size="21" font-weight="700" fill="#32292F" text-anchor="middle" >Fly connectome</text><text x="814.0" y="106" font-size="16" font-weight="400" fill="#32292F" text-anchor="middle" >~140k neurons</text><line x1="916" y1="82.0" x2="944" y2="82.0" stroke="#99E1D9" stroke-width="2.5" marker-end="url(#a)"/><rect x="948" y="30" width="196" height="104" rx="12" fill="#32292F" stroke="#99E1D9" stroke-width="2"/><text x="1046.0" y="76" font-size="21" font-weight="700" fill="#99E1D9" text-anchor="middle" >Motor neurons</text><text x="1046.0" y="106" font-size="16" font-weight="400" fill="#B9AEB5" text-anchor="middle" >turn / walk / back up</text><path d="M1046.0 138V194H118.0V144" fill="none" stroke="#99E1D9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="582.0" y="182" font-size="17" font-weight="500" fill="#F4F1F3" text-anchor="middle" >the fly moves (or dodges), then pings again</text></svg>